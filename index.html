<!DOCTYPE html>
<html>
<head>
    <title>Aplikasi Nilai Siswa</title>
</head>
<body>
    <h1>Aplikasi Pengolahan Nilai</h1>

    <script>
        // Mengambil input dari pengguna
        let nama = prompt("Masukkan nama siswa:");

        let inputTugas = prompt("Masukkan nilai tugas:");
        let inputUTS = prompt("Masukkan nilai UTS:");
        let inputUAS = prompt("Masukkan nilai UAS:");

        // Mengubah input menjadi angka
        let tugas = Number(inputTugas);
        let uts = Number(inputUTS);
        let uas = Number(inputUAS);

        // Validasi data
        if (
            nama === null || nama.trim() === "" ||
            inputTugas === null || inputTugas.trim() === "" ||
            inputUTS === null || inputUTS.trim() === "" ||
            inputUAS === null || inputUAS.trim() === "" ||
            !Number.isFinite(tugas) ||
            !Number.isFinite(uts) ||
            !Number.isFinite(uas) ||
            tugas < 0 || tugas > 100 ||
            uts < 0 || uts > 100 ||
            uas < 0 || uas > 100
        ) {
            alert("Data tidak valid. Periksa kembali input!");
        } else {
            // Menghitung nilai akhir
            let nilaiAkhir =
                (tugas * 0.3) +
                (uts * 0.3) +
                (uas * 0.4);

            // Menentukan predikat
            let predikat;

            if (nilaiAkhir >= 90) {
                predikat = "A";
            } else if (nilaiAkhir >= 80) {
                predikat = "B";
            } else if (nilaiAkhir >= 75) {
                predikat = "C";
            } else if (nilaiAkhir >= 60) {
                predikat = "D";
            } else {
                predikat = "E";
            }

            let keterangan;

            if (nilaiAkhir >= 75) {
                keterangan = "LULUS";
            } else {
                keterangan = "BELUM LULUS";
            }

            // Menampilkan hasil
            alert(
                "HASIL PENGOLAHAN NILAI\n\n" +
                "Nama: " + nama + "\n" +
                "Nilai Tugas: " + tugas + "\n" +
                "Nilai UTS: " + uts + "\n" +
                "Nilai UAS: " + uas + "\n" +
                "Nilai Akhir: " + nilaiAkhir.toFixed(2) + "\n" +
                "Predikat: " + predikat + "\n" +
                "Keterangan: " + keterangan
            );

            console.log("Nama:", nama);
            console.log("Nilai Akhir:", nilaiAkhir.toFixed(2));
            console.log("Predikat:", predikat);
            console.log("Keterangan:", keterangan);
        }
    </script>
</body>
</html>
